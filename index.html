<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Infoportal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/ical.js/dist/ical.es5.min.cjs"></script>
<style>
  :root{
    --bg:#14161a;
    --panel:#1b1e24;
    --line:#2a2e35;
    --text:#f4f2ea;
    --text-dim:#8b8f96;
    --red:#e6392f;
    --green:#3fa66a;
    --amber:#d99a3d;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .eyebrow{
    font-size:0.72rem; font-weight:700; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--text-dim); margin:0 0 10px 0;
  }
  .tram .eyebrow, .weather .eyebrow{ font-size:0.62rem; margin-bottom:6px; }
  .grid{
    display:grid; height:100vh; width:100vw;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto 0.85fr 1.15fr;
    grid-template-areas:
      "header   header   header"
      "tram     weather  photos"
      "calendar calendar calendar";
    gap:1px; background:var(--line);
  }
  .panel{ background:var(--panel); padding:22px 26px; overflow:hidden; }
  .header{ grid-column:1/4; }
  .tram, .weather{ padding:16px 22px; }

  /* Header */
  .header{ grid-area:header; display:flex; align-items:baseline; justify-content:space-between; padding:20px 30px; }
  .header .place{ font-size:1.05rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }
  .header .place .dot{ color:var(--red); }
  .clockwrap{ text-align:right; }
  .clock{ font-size:2.6rem; font-weight:800; line-height:1; letter-spacing:0.01em; }
  .clock span{ color:var(--red); }
  .date{ font-size:0.9rem; color:var(--text-dim); margin-top:4px; text-transform:capitalize; }

  /* Tram */
  .tram{ grid-area:tram; }
  .tram-row{
    display:grid; grid-template-columns:36px 1fr auto; align-items:center;
    gap:12px; padding:7px 0; border-bottom:1px solid var(--line); position:relative;
  }
  .tram-row:last-child{ border-bottom:none; }
  .badge{
    width:28px; height:28px; border-radius:50%; background:var(--red); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:0.8rem; flex-shrink:0;
  }
  .badge-square{ border-radius:6px; }
  .badge-green{ background:var(--green); }
  .dest{ font-size:0.85rem; font-weight:600; }
  .mins{ font-size:1.1rem; font-weight:800; text-align:right; min-width:52px; }
  .mins small{ font-size:0.7rem; font-weight:600; color:var(--text-dim); }
  .urgency{ position:absolute; bottom:0; left:0; height:2px; background:var(--red); }

  /* Weather */
  .weather{ grid-area:weather; display:flex; flex-direction:column; }
  .wx-cities{ display:flex; flex-direction:column; gap:8px; justify-content:flex-start; }
  .wx-city{
    display:flex; align-items:center; gap:12px;
    border:2px solid var(--text-dim); border-radius:8px; padding:8px 12px;
  }
  .wx-city .name{ width:60px; flex-shrink:0; font-size:0.85rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--text); }
  .wx-periods{ display:flex; gap:10px; flex:1; }
  .wx-webcam-large{
    width:100%; max-height:64px; margin-top:8px; border-radius:6px; object-fit:cover;
    border:1px solid var(--line); background:#000; display:block;
  }
  .wx-period{ text-align:center; flex:1; }
  .wx-period .wx-icon{ font-size:1.3rem; line-height:1; }
  .wx-period .wx-temp{ font-size:1.05rem; font-weight:800; margin-top:2px; }
  .wx-period .wx-label{ font-size:0.55rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin-top:2px; }

  /* Calendar */
  .calendar{
    grid-area:calendar; padding:26px 30px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  #cal-list{
    display:grid; grid-template-columns:repeat(7,1fr); gap:0 20px;
    flex:1; min-height:0;
  }
  .cal-day{ border-left:1px solid var(--line); padding-left:18px; overflow-y:auto; }
  .cal-day:first-child{ border-left:none; padding-left:0; }
  .cal-day-label{ font-size:0.95rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--amber); margin-bottom:12px; }
  .cal-event{ font-size:1.05rem; margin-bottom:12px; line-height:1.3; }
  .cal-event .time{ display:block; color:var(--text-dim); font-weight:600; font-size:0.8rem; margin-bottom:2px; }
  .cal-empty{ color:var(--text-dim); font-size:0.95rem; }

  /* Photos */
  .photos{ grid-area:photos; position:relative; padding:0; }
  .photo-frame{ position:absolute; inset:18px; border-radius:6px; overflow:hidden; background:#000 center/cover no-repeat; transition:background-image 0.4s ease; }
  .photo-label{ position:absolute; left:18px; bottom:18px; z-index:2; font-size:0.72rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#fff; background:rgba(0,0,0,0.45); padding:5px 10px; border-radius:4px; }

  .status{ color:var(--text-dim); font-size:0.9rem; }
</style>
</head>
<body>

<div class="grid">
  <div class="panel header">
    <div class="place">Bruderholz <span class="dot">·</span> Basel</div>
    <div class="clockwrap">
      <div class="clock" id="clock">--:--<span>:--</span></div>
      <div class="date" id="date">–</div>
    </div>
  </div>

  <div class="panel tram">
    <div class="eyebrow">Tram 15 / 16 · Abfahrten</div>
    <div id="tram-list"><div class="status">Lädt…</div></div>
  </div>

  <div class="panel weather">
    <div class="eyebrow">Wetter</div>
    <div class="wx-cities" id="weather-list">
      <div class="status">Lädt…</div>
    </div>
    <img class="wx-webcam-large" id="brigels-webcam-large" alt="Webcam Brigels" style="display:none;">
  </div>

  <div class="panel calendar">
    <div class="eyebrow">Kalender · nächste 7 Tage</div>
    <div id="cal-list"><div class="status">Lädt…</div></div>
  </div>

  <div class="panel photos">
    <div class="photo-frame" id="photo-frame"></div>
    <div class="photo-label">Favoriten</div>
  </div>
</div>

<script>
/* ============ KONFIGURATION – hier eintragen ============ */
const CONFIG = {
  WORKER_URL: "https://infoportal-proxy.9c65t7htnp.workers.dev",

  // GitHub-Repo, in dem diese index.html liegt (für den Fotos-Ordner)
  GITHUB_USER: "stbernet",
  GITHUB_REPO: "Infoportal",
  PHOTOS_FOLDER: "photos", // Ordnername im Repo, in den du Fotos hochlädst

  TRAM_STATION_QUERY: "Bruderholz",   // Suchbegriff für die Haltestelle
  TRAM_LINES: ["15", "16"],

  WEATHER: [
    { name: "Basel",   lat: 47.5596, lon: 7.5886 },
    { name: "Brigels",  lat: 46.7847, lon: 9.0567 },
  ],

  BRIGELS_WEBCAM_URL: "https://wtvpictfc.feratel.com/picture/35/4087.jpeg?design=noxdesign&dcsdesign=WTP_feratel.com",
};
/* ========================================================= */

// ---------- Uhr ----------
function updateClock(){
  const now = new Date();
  const time = now.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const [hm, s] = [time.slice(0,5), time.slice(6,8)];
  document.getElementById("clock").innerHTML = `${hm}<span>:${s}</span>`;
  document.getElementById("date").textContent = now.toLocaleDateString("de-CH",{weekday:"long", day:"numeric", month:"long"});
}
updateClock();
setInterval(updateClock, 1000);

// ---------- Wetter (Open-Meteo) ----------
const WMO_ICON = {
  0:"☀️",1:"🌤️",2:"⛅",3:"☁️",
  45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌦️",
  61:"🌧️",63:"🌧️",65:"🌧️",71:"🌨️",73:"🌨️",75:"🌨️",
  80:"🌦️",81:"🌦️",82:"⛈️",95:"⛈️",96:"⛈️",99:"⛈️"
};
async function loadWeather(){
  const html = await Promise.all(CONFIG.WEATHER.map(async city => {
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&hourly=temperature_2m,weathercode&timezone=Europe%2FZurich&forecast_days=1`;
      const res = await fetch(url);
      const data = await res.json();
      const temps = data.hourly.temperature_2m;
      const codes = data.hourly.weathercode;
      const periods = [
        { label: "Morgen", hour: 8 },
        { label: "Mittag", hour: 13 },
        { label: "Abend",  hour: 19 },
      ];
      const periodsHtml = periods.map(p => {
        const icon = WMO_ICON[codes[p.hour]] ?? "❔";
        const temp = Math.round(temps[p.hour]);
        return `<div class="wx-period">
          <div class="wx-icon">${icon}</div>
          <div class="wx-temp">${temp}°</div>
          <div class="wx-label">${p.label}</div>
        </div>`;
      }).join("");
      return `<div class="wx-city">
        <div class="name">${city.name}</div>
        <div class="wx-periods">${periodsHtml}</div>
      </div>`;
    }catch(e){
      return `<div class="wx-city"><div class="name">${city.name}</div><div class="status">Nicht verfügbar</div></div>`;
    }
  }));
  document.getElementById("weather-list").innerHTML = html.join("");
  const webcamEl = document.getElementById("brigels-webcam-large");
  webcamEl.src = `${CONFIG.BRIGELS_WEBCAM_URL}&t=${Date.now()}`;
  webcamEl.style.display = "block";
}
loadWeather();
setInterval(loadWeather, 15*60*1000);

// ---------- Tram (transport.opendata.ch) ----------
async function loadTram(){
  const el = document.getElementById("tram-list");
  try{
    const locRes = await fetch(`https://transport.opendata.ch/v1/locations?query=${encodeURIComponent(CONFIG.TRAM_STATION_QUERY)}`);
    const locData = await locRes.json();
    const station = locData.stations?.[0];
    if(!station){ el.innerHTML = `<div class="status">Haltestelle nicht gefunden</div>`; return; }

    const sbRes = await fetch(`https://transport.opendata.ch/v1/stationboard?id=${station.id}&limit=40`);
    const sbData = await sbRes.json();

    const rows = (sbData.stationboard || [])
      .filter(e => CONFIG.TRAM_LINES.includes(String(e.number)))
      .slice(0, 6)
      .map(e => {
        const dep = new Date(e.stop.departure);
        const mins = Math.max(0, Math.round((dep - Date.now())/60000));
        const urgencyPct = Math.max(4, 100 - Math.min(mins,20)*5);
        const isLine16 = String(e.number) === '16';
        const badgeClass = isLine16 ? 'badge badge-square' : 'badge badge-green';
        const lineColor = isLine16 ? 'var(--red)' : 'var(--green)';
        return `<div class="tram-row">
          <div class="${badgeClass}">${e.number}</div>
          <div class="dest">${e.to}</div>
          <div class="mins">${mins}<small> min</small></div>
          <div class="urgency" style="width:${urgencyPct}%; background:${lineColor}"></div>
        </div>`;
      });

    el.innerHTML = rows.length ? rows.join("") : `<div class="status">Keine Abfahrten gefunden</div>`;
  }catch(e){
    el.innerHTML = `<div class="status">Nicht verfügbar</div>`;
  }
}
loadTram();
setInterval(loadTram, 30*1000);

// ---------- Kalender (via Worker-Proxy + ical.js) ----------
function unfoldICS(text){
  const rawLines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  const propStart = /^[A-Za-z0-9-]+[;:]/; // z.B. "SUMMARY:" oder "DTSTART;TZID=..."
  const lines = [];
  for (const line of rawLines){
    const isContinuation =
      /^[ \t]/.test(line) ||
      (lines.length > 0 &&
        line.trim() !== "" &&
        line !== "BEGIN:VEVENT" && line !== "END:VEVENT" &&
        line !== "BEGIN:VCALENDAR" && line !== "END:VCALENDAR" &&
        line !== "BEGIN:VTIMEZONE" && line !== "END:VTIMEZONE" &&
        !propStart.test(line));
    if (isContinuation && lines.length > 0){
      lines[lines.length - 1] += line.replace(/^[ \t]/, "");
    } else {
      lines.push(line);
    }
  }
  return lines.join("\n");
}
async function loadCalendar(){
  const el = document.getElementById("cal-list");
  try{
    const res = await fetch(`${CONFIG.WORKER_URL}/calendar`);
    let icsText = await res.text();
    icsText = unfoldICS(icsText);
    const jcal = ICAL.parse(icsText);
    const comp = new ICAL.Component(jcal);
    const vevents = comp.getAllSubcomponents("vevent");

    const now = new Date();
    const rangeStart = new Date(now); rangeStart.setHours(0,0,0,0);
    const rangeEnd = new Date(rangeStart); rangeEnd.setDate(rangeEnd.getDate()+7);

    let occurrences = [];
    vevents.forEach(vevent => {
      const event = new ICAL.Event(vevent);
      if(event.isRecurring()){
        const iterator = event.iterator();
        let next; let guard = 0;
        while((next = iterator.next()) && guard < 500){
          guard++;
          const d = next.toJSDate();
          if(d > rangeEnd) break;
          if(d >= rangeStart){
            occurrences.push({summary:event.summary, start:d, allDay:event.startDate.isDate});
          }
        }
      } else {
        const d = event.startDate.toJSDate();
        if(d >= rangeStart && d <= rangeEnd){
          occurrences.push({summary:event.summary, start:d, allDay:event.startDate.isDate});
        }
      }
    });
    occurrences.sort((a,b)=>a.start-b.start);

    // nach Tag gruppieren
    const byDay = {};
    occurrences.forEach(o=>{
      const key = o.start.toDateString();
      (byDay[key] ??= []).push(o);
    });

    const days = [];
    for(let i=0;i<7;i++){
      const d = new Date(rangeStart); d.setDate(d.getDate()+i);
      days.push(d);
    }

    el.innerHTML = days.map(d=>{
      const key = d.toDateString();
      const label = d.toLocaleDateString("de-CH",{weekday:"short", day:"numeric", month:"short"});
      const events = byDay[key] || [];
      const evHtml = events.length
        ? events.map(e=>`<div class="cal-event"><div class="time">${e.allDay ? "Ganztags" : e.start.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"})}</div><div>${e.summary}</div></div>`).join("")
        : `<div class="cal-empty">–</div>`;
      return `<div class="cal-day"><div class="cal-day-label">${label}</div>${evHtml}</div>`;
    }).join("");
  }catch(e){
    el.innerHTML = `<div class="status">Kalender nicht verfügbar</div>`;
  }
}
loadCalendar();
setInterval(loadCalendar, 30*60*1000);

// ---------- Fotos (aus dem "photos"-Ordner im GitHub-Repo) ----------
let photoUrls = [];
let photoIndex = 0;
async function loadPhotos(){
  try{
    const apiUrl = `https://api.github.com/repos/${CONFIG.GITHUB_USER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.PHOTOS_FOLDER}`;
    const res = await fetch(apiUrl);
    const files = await res.json();
    if(Array.isArray(files)){
      photoUrls = files
        .filter(f => /\.(jpe?g|png|heic|webp)$/i.test(f.name))
        .map(f => f.download_url);
      if(photoUrls.length) renderPhoto();
    }
  }catch(e){ /* wird beim nächsten Intervall erneut versucht */ }
}
function renderPhoto(){
  if(!photoUrls.length) return;
  const frame = document.getElementById("photo-frame");
  const url = photoUrls[photoIndex % photoUrls.length];
  frame.style.backgroundImage = `url("${url}")`;
  photoIndex++;
}
loadPhotos();
setInterval(loadPhotos, 60*60*1000);   // Fotoliste stündlich neu laden
setInterval(renderPhoto, 12*1000);     // alle 12s nächstes Foto zeigen
</script>
</body>
</html>
